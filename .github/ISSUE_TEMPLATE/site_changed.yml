name: Site changed / selectors broke
description: Mercor changed something and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth its
        own report because the fix is different from a code bug: something on
        mercor.com moved.

        Useful to know before filing: the parser does not read the DOM. Rows
        come from `<script id="__NEXT_DATA__">` (the React Query cache), and a
        detail page's `JobPosting` JSON-LD is read only for the currency and
        employment type. Which of those broke narrows the fix a lot — see
        "Reporting a site change" in CONTRIBUTING.md.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - Rows (0 rows on a page that visibly has listings)
        - A specific field is null or wrong (rate, currency, sku, URL)
        - A core-field coverage warning in the run log
        - --mode job misses listings the sitemap holds
        - The captcha detector finds nothing on a page that has one
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The exact URL and --mode, and the country your exit IP was in.
      placeholder: "https://work.mercor.com/explore (--mode listings, exit IP: DE datacentre)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the page
      description: |
        Whichever of these you can get. A capture beats a description.

        - A `--dump-html` capture of the page, or the first part of its
          `<script id="__NEXT_DATA__">` payload.
        - For a field problem: the value you got, and the value on the page.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, whether it reproduces from a
        different country, and when it last worked.
